name: flowledger

x-app: &app
  image: flowledger-local:${FLOWLEDGER_IMAGE_TAG:-dev}
  build:
    context: .
  environment:
    FLOWLEDGER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowledger}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-flowledger}
    FLOWLEDGER_REDIS_URL: redis://redis:6379/0
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine@sha256:5d9ee39acd134b44f52fc49ca3b88fc651f0560b0db93292fcd37ff150c71d3a
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowledger}
      POSTGRES_USER: ${POSTGRES_USER:-flowledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    environment:
      FLOWLEDGER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowledger}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-flowledger}
      FLOWLEDGER_REDIS_URL: redis://redis:6379/0
      FLOWLEDGER_AUTH_TOKENS: ${FLOWLEDGER_AUTH_TOKENS:?copy .env.example to .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  relay:
    <<: *app
    command: ["python", "-m", "flowledger.runtime", "relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["python", "-m", "flowledger.runtime", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
