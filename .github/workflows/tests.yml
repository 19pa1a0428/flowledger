name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FLOWLEDGER_TEST_REDIS_URL: redis://localhost:6379/15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  postgres-plans:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flowledger_test
          POSTGRES_USER: flowledger
          POSTGRES_PASSWORD: flowledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowledger -d flowledger_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FLOWLEDGER_DATABASE_URL: postgresql+psycopg://flowledger:flowledger@localhost:5432/flowledger_test
      FLOWLEDGER_TEST_POSTGRES_URL: postgresql+psycopg://flowledger:flowledger@localhost:5432/flowledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m alembic upgrade head
      - run: python scripts/measure_query_plans.py --confirm-disposable
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example up --build --detach --wait
      - run: python scripts/compose_smoke.py
      - if: always()
        run: docker compose --env-file .env.example logs --no-color
      - if: always()
        run: docker compose --env-file .env.example down --volumes

